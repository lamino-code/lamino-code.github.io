<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add levels</title>
    <link rel="icon" href="./SecretCoin.png">
        <link rel="stylesheet" href="./base.css">
        <link rel="stylesheet" href="./index.css">
    <style>
        input{border-radius:15px;padding:15px;}
        .btn{background:'#566666';}
        .difficulty-button{
            width:200px;
            height:200px;
        }
    </style>
</head>
<body>
    <!-- WHAT THE HECK DO I DO NOW -->
    <script src="/inject.js"></script>
    <div style="padding-top:50px;" class="vertical">
        <div class="horizontal">
            <input id="name" type="text" placeholder="Enter name" style="font-family:Pusab;font-size:2em;width:1fr;">
            <input id="id" type="number" placeholder="ID" style="font-family:Pusab;font-size:2em;width:1fr;">
            <button onclick="copyText()" style="font-family:Pusab;font-size:2em;border-radius:15px;width:1fr;" class="btn">Copy Code</button>
        </div>
        <div id='difficulties' class="horizontal" style="padding:10px;width:90%;gap:10px;"></div>
        <iframe src="https://gdbrowser.com" style="box-sizing:border-box;width:100%;max-width:100%;padding:25px;border-radius:25px;aspect-ratio:18/7;"></iframe>
    </div>
    <script>
        sela=new Audio('./button.mp3');
        play=function(sel){
            sel.play()
            sel.currentTime = 0
        }
        copyText=()=>{
            name=document.getElementById('name').value;
            id=document.getElementById('id').value;
            let levelData=id?[name,id]:name;
            const clipboardData={
                level:levelData,
                difficulty:selectedDifficulty
            };
            navigator.clipboard.writeText(JSON.stringify(clipboardData));
            play(sela);
        }

       let difficulties = document.getElementById('difficulties');
    let selectedDifficulty;
    let diffs = ['Auto','Easy','Normal','Hard','Harder','Insane','EasyDemon','MediumDemon','HardDemon','InsaneDemon','ExtremeDemon'];
    select=d=>{
        selectedDifficulty=d;
        play(sela);
        ([...difficulties.children]).forEach(c=>{
        if(c.id===d){c.style.outline='5px solid green'}else{c.style.outline='none'}
        })
    }
    for(let i of diffs){
        let button=document.createElement('button');
        button.id=i
        button.style='width:fit-content;height:125px;'
        button.classList='btn difficulty-button'
        button.innerHTML=`<img style='width:100px;' src="./difficulty-faces/${i}.png">`;
        button.onclick=()=>select(button.id)
        difficulties.appendChild(button)
    }
    // THIS IS HOW YOU CONVERT API DATA
    // converted=JSON.stringify({"level":dummy.id?[dummy.name,dummy.id]:dummy.name,"difficulty":dummy.difficulty});console.log(converted)
    </script>
</body>
</html>
