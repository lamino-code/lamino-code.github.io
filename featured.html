<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<link rel='icon' href='i.png'>
    <style>
        .d{
          padding:1.5vw;
          border-radius:20px;
          width:70%;
          background:linear-gradient(50deg, black 0%, gray 100%);
          box-shadow:5px 10px lightgray;
          font-family:"Nunito",system-ui;
          text-align:center;
          font-size:2.5vw;
          font-weight:700;
        }
        .container{
            background:rgba(0,0,0,0.2);
            border-radius:0.8vw;
            justify-content:center;
	    	align-items:center;
            display:grid;
            grid-template-columns:var(--rows,repeat(2,1fr));
            gap:0.8vw;
	    	padding:2vw;
        }
		.card:hover{transform:scale(1.1) translateX(-2vw) translateY(-2vw);z-index:800;box-shadow:8px 8px 4px rgba(0,0,0,0.6)}
		.premium{background:linear-gradient(45deg,rgb(247, 152, 11) 80%,rgb(255, 227, 149) 85%,rgb(247, 152, 11) 90%);}
		.regular{background:rgba(138, 182, 248, 0.9);}
		.card{
			transition:transform 0.8s ease, box-shadow 0.8s ease, z-index 0.8s ease-out;
			border-radius:0.8vw;
            border:4px solid white;
            justify-content:center;
	    	align-items:center;
			display:grid;
            grid-template-columns:repeat(2,18vw);
            gap:1vw;
	    	padding:0.25vw;
        }
    .project{
        width:17.6vw;
		align-items:center;
		justify-content:center;
		gap:0.8vw;
		padding:0.3vw;
		display:flex;
		flex-direction:column;
    }
	.stats{
        width:fit-content;
		display:flex;
		gap:0.8vw;
		flex-direction:row;
		align-items:center;
		align-content:center;
		height:2vw;
    }
	.j{
	    transition:color 0.4s ease;
	    display:block;
	    text-decoration:none;
	    font-weight:900;
		line-height:1.3;
        font-family:'Nunito',sans-serif;
        font-size:0.9vw;
		text-shadow:1px 1px 4px rgba(0,0,0,0.4);
	    color:white;
	    text-align:center;
		margin:0;
	}
	.chevron{
    	appearance: none;
		padding-right: 4vw !important;
		background-image:url('./chevron-down.svg');
		background-repeat:no-repeat;
		background-position: right 0.8vw center;
		background-size: 3vw;
	}
	.viewer{
		width:25vw;
		align-items:center;
		justify-content:center;
		border-radius:2vw;
		gap:2vw;
		padding:2vw;
		display:flex;
		flex-direction:column;
		border:6px solid white;
	}
	.ult{
		align-items:center;
		justify-content:center;
		border-radius:2vw;
		gap:2vw;
		padding:2vw;
		display:flex;
		flex-direction:row;
	}
	.search{font-size:2vw;font-family:"Nunito",sans-serif;border-radius:3vw;width:30vw;height:4vw;padding:0.3vw;}
	.desc{overflow-y:auto;overflow-x:hidden;height:11.5vw;width:16vw;}
	.vd{overflow-y:auto;overflow-x:hidden;height:12vw;width:24vw;}
	.m{width:5.5vw;font-size:1vw;}
	.vi{font-size:2vw;}
	.dt{width:17.3vw;font-size:1vw;}
	a{text-decoration:none;}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Featured Projects</title>
</head>
<body>
    <div id="content" class="content">
        <script src="inject.js"></script>
		<p id="pagetitle" style='color:white' class='d'>Scratch Master's Featured Projects</p>
		<div id="navi" style='display:flex;flex-direction:row;'>
		<input class="search" style="height:3vw;" type="text" id="search" placeholder="Search">
		<select id='sortbutton' class="search chevron">
			<option value="dd">Newest First</option>
    		<option value="da">Oldest First</option>
			<option value="ff">Most Popular</option>
    		<option value="lp">Least Popular</option>
			<option value="best">Best</option>
			<option value="mf">Most Favourites</option>
    		<option value="lf">Least Favourites</option>
			<option value="ml">Most Loves</option>
    		<option value="ll">Least Loves</option>
		</select>
		</div>
    <div class='container' id="fe">
    </div>
    <script>
	let params=new URLSearchParams(window.location.search)
	let projectid=params.get("project")
	const countryCodes={"afghanistan":"af","albania":"al","algeria":"dz","andorra":"ad","angola":"ao","argentina":"ar","armenia":"am","australia":"au","austria":"at","azerbaijan":"az","bahamas":"bs","bahrain":"bh","bangladesh":"bd","barbados":"bb","belarus":"by","belgium":"be","belize":"bz","benin":"bj","bhutan":"bt","bolivia":"bo","bosnia":"ba","botswana":"bw","brazil":"br","brunei":"bn","bulgaria":"bg","cambodia":"kh","cameroon":"cm","canada":"ca","chile":"cl","china":"cn","colombia":"co","costa rica":"cr","croatia":"hr","cuba":"cu","cyprus":"cy","czechia":"cz","czech republic":"cz","denmark":"dk","dominican republic":"do","ecuador":"ec","egypt":"eg","el salvador":"sv","estonia":"ee","ethiopia":"et","fiji":"fj","finland":"fi","france":"fr","gambia":"gm","georgia":"ge","germany":"de","ghana":"gh","greece":"gr","guatemala":"gt","haiti":"ht","honduras":"hn","hungary":"hu","iceland":"is","india":"in","indonesia":"id","iran":"ir","iraq":"iq","ireland":"ie","israel":"il","italy":"it","jamaica":"jm","japan":"jp","jordan":"jo","kazakhstan":"kg","kenya":"ke","kuwait":"kw","latvia":"lv","lebanon":"lb","libya":"ly","liechtenstein":"li","lithuania":"lt","luxembourg":"lu","madagascar":"mg","malaysia":"my","maldives":"mv","mali":"ml","malta":"mt","mexico":"mx","monaco":"mc","mongolia":"mn","morocco":"ma","mozambique":"mz","myanmar":"mm","namibia":"na","nepal":"np","netherlands":"nl","new zealand":"nz","nicaragua":"ni","nigeria":"ng","north korea":"kp","norway":"no","oman":"om","pakistan":"pk","panama":"pa","paraguay":"py","peru":"pe","philippines":"ph","poland":"pl","portugal":"pt","qatar":"qa","romania":"ro","russia":"ru","saudi arabia":"sa","senegal":"sn","serbia":"rs","singapore":"sg","slovakia":"sk","slovenia":"si","south africa":"za","south korea":"kr","korea":"kr","spain":"es","sri lanka":"lk","sudan":"sd","sweden":"se","switzerland":"ch","syria":"sy","taiwan":"tw","thailand":"th","tunisia":"tn","turkey":"tr","turkiye":"tr","ukraine":"ua","united arab emirates":"ae","uae":"ae","united kingdom":"gb","uk":"gb","britain":"gb","united states":"us","usa":"us","america":"us","uruguay":"uy","uzbekistan":"uz","venezuela":"ve","vietnam":"vn","yemen":"ye","zambia":"zm","zimbabwe":"zw"};
	countryCode=c=>countryCodes[c.toLowerCase()]||null
	let tmp=localStorage.getItem('featured')
	let cache=tmp?JSON.parse(tmp):{}
	let tmpa=localStorage.getItem('authors')
	let ath=tmpa?JSON.parse(tmpa):{}
	featured=[1380826278,980280062,1180951523,1316859114,1047970867,1351101699,1381941303,1380457093];
	if(!projectid){
	container=document.getElementById('fe')
	document.documentElement.style.setProperty('--rows','repeat(1,1fr)');
	emp=document.createElement("p");
	emp.style.fontFamily=`"Nunito",sans-serif`;emp.style.fontSize="7vw";emp.style.textAlign="center";emp.style.width="60vw";emp.style.color="white";emp.innerText="Loading...";emp.style.margin="0"
	container.appendChild(emp);
	progress=document.createElement("progress");
	progress.max=featured.length*2
	progress.value=0;
	progress.style.width="100%"
	progress.style.height="20vw"
	container.appendChild(progress);
	let getData=(async function(i){let r=await fetch(`https://proxy.corsfix.com/?https://api.scratch.mit.edu/projects/${i}/`);if(r.ok){return await r.json()}});
	let getAuth=(async function(i){let r=await fetch(`https://proxy.corsfix.com/?https://api.scratch.mit.edu/users/${i}/`);if(r.ok){return await r.json()}});
	let cacheProjects=(async function(){for(i of featured){data=await getData(i);progress.value++;cache={...cache,[i]:data}};localStorage.setItem('featured',JSON.stringify(cache));})
	let cacheAuth=(async function(){for(i of featured.map(j=>cache[j]?.author.username)){data=await getAuth(i);progress.value++;ath={...ath,[data?.username]:data}};localStorage.setItem('authors',JSON.stringify(ath));})
	parseDate=a=>Date.parse(cache[a]?.history?.created)||0
	views=a=>cache[a]?.stats?.views||0
	loves=a=>cache[a]?.stats?.loves||0
	faves=a=>cache[a]?.stats?.favorites||0
	query=''
    update=async(q)=>{
		container.innerHTML=""
		let json;let temp;
        let referenceLink;
		let links;let images;
        for(let i of sortFeatured(featured,srt.value)){
			data=cache[i]
			if(data?.title.toLowerCase().includes(q)||data?.author?.username.toLowerCase().includes(q)||ath[data?.author?.username]?.profile.country.toLowerCase().includes(q)||(data?.description||data?.instructions).toLowerCase().includes(q)||!q){
			// PROJECT CARD
			let card=document.createElement("div")
			card.className="regular card"
			if(data.stats.views/data.stats.loves<6){card.className="premium card"}
			container.appendChild(card)
			// PROJECT IMAGE
			let prjct=document.createElement("div")
			prjct.className="project"
			card.appendChild(prjct)
			let link=document.createElement("a")
			referenceLink=`?project=${i}`
			link.href=referenceLink
			link.target = "_blank"
			prjct.appendChild(link)
			link.style.width="18vw"
            let c=document.createElement("img")
            c.className="project"
			c.style.width="17.3vw"
			c.style.borderRadius="1vw"
            c.src=`https://uploads.scratch.mit.edu/projects/thumbnails/${i}.png`
			c.style.background="none";
			link.appendChild(c)
			// INFO
			let info=document.createElement("div")
			info.className="project"
			card.appendChild(info)
			// STATS
			let stats=document.createElement("div")
			stats.className="project stats"
			card.appendChild(stats)
			// SHARED
			let shared=document.createElement("div")
			shared.className="project stats"
			card.appendChild(shared)
		// AUTHOR PROFILE PICTURE
		let projectauthor=document.createElement("div")
		projectauthor.className="stats"
		info.appendChild(projectauthor)
	    let l=document.createElement("img")
		l.src=data?.author?.profile?.images?.["90x90"];
		l.style.width="2.25vw";
		l.style.height="2.25vw"
		l.style.borderRadius="0.4vw"
	    projectauthor.appendChild(l)
		// DESCRIPTION
		let desc=document.createElement("p")
		desc.className="desc j"
		desc.innerText=data?.description||data?.instructions||`No description available`
		info.appendChild(desc)
		// VIEWS
		let views=document.createElement("p")
		views.className="j m"
		views.innerText=`👁️${data?.stats.views}`
		stats.appendChild(views)
		// LOVES
		let loves=document.createElement("p")
		loves.className="j m"
		loves.innerText=`❤️${data?.stats.loves}`
		stats.appendChild(loves)
		// FAVOURITES
		let favourites=document.createElement("p")
		favourites.className="j m"
		favourites.innerText=`⭐${data?.stats.favorites}`
		stats.appendChild(favourites)
		// CREATION DATE
		let createdate=document.createElement("p")
		createdate.className="j dt"
		createdate.innerText=data?.history.created?`Created ${new Date(data?.history.created).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}`:`Date unknown`
		shared.appendChild(createdate)
		// LINK TO USER
	    let f=document.createElement("a")
        f.href=referenceLink
        f.innerText=data?.title||`Title unavailable`
    	f.className=`j`
		prjct.appendChild(f)
        let g=document.createElement("a")
        g.href=`https://scratch.mit.edu/users/${data?.author.username}`
        g.target = "_blank"
        g.text=data?.author?.username||`author not found`
        g.className=`j k`
       	projectauthor.appendChild(g)
		// COUNTRY
		let country=document.createElement("img")
		country.src=`https://flagcdn.com/40x30/${countryCode(ath[data?.author.username]?.profile.country)}.png`
        country.style.width="2.6vw"
		country.style.height="2vw"
        country.className=`j k`
       	projectauthor.appendChild(country)
        }
	}
	if(!container.innerHTML){
		document.documentElement.style.setProperty('--rows','repeat(1,1fr)');
		emp=document.createElement("p");
		emp.style.fontFamily=`"Nunito",sans-serif`;
		emp.style.fontSize="7vw";
		emp.style.textAlign="center";
		emp.style.width="60vw";
		emp.style.color="white";
		emp.innerText="No projects found";
		container.appendChild(emp);
	}else{document.documentElement.style.setProperty('--rows','repeat(2,1fr)')}
	}
	search=document.getElementById("search")
	search.addEventListener('input',(e)=>{
    	query=e.target.value.toLowerCase().trim();
    	update(query)
	});
	sortFeatured=(c,d)=>{
		if(d==="dd"){return c.sort((a,b)=>parseDate(b)-parseDate(a))}
		if(d==="da"){return c.sort((a,b)=>parseDate(a)-parseDate(b))}
		if(d==="ff"){return c.sort((a,b)=>views(b)-views(a))}
		if(d==="lp"){return c.sort((a,b)=>views(a)-views(b))}
		if(d==="best"){return c.sort((a,b)=>(views(a)/loves(a))-(views(b)/loves(b)))
		}
		if(d==="mf"){
			return c.sort((a,b)=>faves(b)-faves(a))
		}
		if(d==="lf"){
			return c.sort((a,b)=>faves(a)-faves(b))
		}
		if(d==="ml"){
			return c.sort((a,b)=>loves(b)-loves(a))
		}
		if(d==="ll"){
			return c.sort((a,b)=>loves(a)-loves(b))
		}
	}
	let srt=document.getElementById("sortbutton");
	srt.addEventListener("change",()=>{
    	update(query);
	});
	(async()=>{
		if(!tmp||Object.keys(cache).length==0||(Date.now()-localStorage.getItem("refresh"))>60000){
			cache={};await cacheProjects();await cacheAuth();localStorage.setItem("refresh",Date.now())
		};update("")})();
	}else{
		data=cache[projectid]
		container=document.getElementById("content")
		document.getElementById("pagetitle").innerText="Scratch Project Viewer"
		document.getElementById("navi").remove();
		document.getElementById("fe").remove();
		links=document.createElement('div')
		links.style.width=`70vw`
		links.style.height=`10vw`
		links.style.border="2px solid white"
		links.style.padding="1vw"
		images=[document.createElement('a'),document.createElement('a'),document.createElement('a')]
		other=[document.createElement('img'),document.createElement('img'),document.createElement('img')]
		other[0].src=`./turbosvg.png`
		other[1].src=`./scratchpng.png`
		other[2].src=`./fork.png`
		images[0].href=`https://turbowarp.org/${projectid}`
		images[0].appendChild(other[0])
		images[1].href=`https://scratch.mit.edu/projects/${projectid}`
		images[1].appendChild(other[1])
		images[2].href=`https://forkphorus.github.io/#${projectid}`
		images[2].appendChild(other[2])
		for(let j of other){
			j.style.width=`10vw`
			j.style.height=`10vw`
		}
		for(let j of images){
		links.appendChild(j)
		}
		container.appendChild(links)
		ult=document.createElement("div")
		ult.className=("ult")
		container.appendChild(ult)
		iframe=document.createElement("iframe");
		iframe.src=`https://scratch.mit.edu/projects/${projectid}/embed`;
		iframe.allowtransparency="true";
		iframe.style.width="40vw";
		iframe.style.height="33.1vw";
		iframe.style.borderRadius="1vw"
		iframe.frameborder="0";
		iframe.scrolling="no"
		ult.appendChild(iframe)
		card=document.createElement("div")
		card.className=("viewer")
		ult.appendChild(card)
		let views=document.createElement("p")
		views.className="j vi"
		views.innerText=`👁️${data?.stats.views}`
		card.appendChild(views)
		// LOVES
		let loves=document.createElement("p")
		loves.className="j vi"
		loves.innerText=`❤️${data?.stats.loves}`
		card.appendChild(loves)
		// FAVOURITES
		let favourites=document.createElement("p")
		favourites.className="j vi"
		favourites.innerText=`⭐${data?.stats.favorites}`
		card.appendChild(favourites)
		// DESC
		let desc=document.createElement("p")
		desc.className="vi j vd"
		desc.style.fontSize="0.9vw"
		desc.innerText=data?.description||data?.instructions
		card.appendChild(desc)
	}
    </script>
</script>
</body>
</html>
