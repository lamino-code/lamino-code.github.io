<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<link rel='icon' href='i.png'>
    <style>
        .d{
          padding:2vw;
          border-radius:20px;
          width:70%;
          background:linear-gradient(50deg, black 0%, gray 100%);
          box-shadow:5px 10px lightgray;
          font-family:"Nunito",system-ui;
          text-align:center;
          font-size:3vw;
          font-weight:700;
        }
		.opacity{background:rgba(0,0,0,0.5);}
        .container{
            background:rgba(0,0,0,0.7);
            border-radius:0.8vw;
            justify-content:center;
	    	align-items:center;
            display:grid;
            grid-template-columns:var(--rows,repeat(2,1fr));
            gap:0.6vw;
	    	padding:0.6vw;
        }
		.card{
			border-radius:0.8vw;
            border:4px solid orange;
			background:linear-gradient(50deg,orange 85%,white 90%,orange 95%);
            justify-content:center;
	    	align-items:center;
			display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:0.6vw;
	    	padding:0.6vw;
        }
	.j:hover{color:white;}
    .project{
        background:rgba(0,0,0,0.5);
        width:15vw;
		align-items:center;
		justify-content:center;
		border-radius:0.6vw;
		gap:0.6vw;
		padding:0.3vw;
		display:inline-flex;
		flex-direction:column;
    }
	.stats{
        width:fit-content;
		border-radius:0.6vw;
		display:flex;
		gap:0.6vw;
		flex-direction:row;
		align-items:center center;
    }
	.j{
	    transition:color 0.4s ease;
	    display:block;
	    text-decoration:none;
	    font-weight:900;
        font-family:'Nunito',sans-serif;
        font-size:1vw;
	    color:orange;
	    text-align:center;
		margin:0;
	}
	.desc{overflow-y:auto;overflow-x:hidden;height:10vw;width:15vw;}
	.m{width:4.5vw;font-size:1vw;}
	.dt{width:15vw;font-size:1vw;}
	a{text-decoration:none;}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Featured Projects</title>
</head>
<body>
    <div class="content">
        <script src="inject.js"></script>
		<p style='color:white' class='d'>Scratch Master's Featured Projects</p>
		<p style='color:white' class='d'>Notes: Clicking a project redirects to the Turbowarp version.</p>
		<input style='font-size:3vw;font-family:"Nunito",sans-serif;border-radius:2vw;width:80vw;height:5vw;padding:5px;' type="text" id="search" placeholder="Search">
    <br>
    <div class='container' id="fe">
    </div>
    <script>
	let cache={}
	featured=[1380826278,980280062,1180951523,1316859114,1047970867,1351101699];
	container=document.getElementById('fe')
	let getData=(async function(i){let r=await fetch(`https://proxy.corsfix.com/?https://api.scratch.mit.edu/projects/${i}/`);if(r.ok){return await r.json()}});
	let cacheProjects=(async function(){for(i of featured){data=await getData(i);cache={...cache,[i]:data}}})
    update=async(q)=>{
		container.innerHTML=""
		let json;let temp;
        let referenceLink;
        for(let i of featured.sort((a,b)=>b-a)){
			data=cache[i]
			if(data?.title.toLowerCase().includes(q)||data?.author?.username.toLowerCase().includes(q)||!q){
			// PROJECT CARD
			let card=document.createElement("div")
			card.className="card"
			container.appendChild(card)
			// PROJECT IMAGE
			let prjct=document.createElement("div")
			prjct.className="project"
			card.appendChild(prjct)
			let link=document.createElement("a")
			referenceLink=`https://turbowarp.org/${i}`
			link.href=referenceLink
			link.target = "_blank"
			prjct.appendChild(link)
			link.style.width="14vw"
            let c=document.createElement("img")
            c.className="project opacity"
			c.style.width="14vw"
            c.src=`https://uploads.scratch.mit.edu/projects/thumbnails/${i}.png`
			link.appendChild(c)
			// INFO
			let info=document.createElement("div")
			info.className="project opacity"
			card.appendChild(info)
			// STATS
			let stats=document.createElement("div")
			stats.className="project opacity stats"
			card.appendChild(stats)
			// SHARED
			let shared=document.createElement("div")
			shared.className="project opacity stats"
			card.appendChild(shared)
		// AUTHOR PROFILE PICTURE
		let projectauthor=document.createElement("div")
		projectauthor.className="stats"
		info.appendChild(projectauthor)
	    let l=document.createElement("img")
		let image=data?.author?.profile?.images?.["90x90"]
	    if(image){l.src=image;l.style.width="2.25vw"}
		l.style.borderRadius="0.3vw"
	    projectauthor.appendChild(l)
		// DESCRIPTION
		let desc=document.createElement("p")
		desc.className="desc j"
		desc.innerText=data?.description||data?.instructions||`No description available`
		info.appendChild(desc)
		// VIEWS
		let views=document.createElement("p")
		views.className="j m"
		views.innerText=`👁️${data?.stats.views}`
		stats.appendChild(views)
		// LOVES
		let loves=document.createElement("p")
		loves.className="j m"
		loves.innerText=`❤️${data?.stats.loves}`
		stats.appendChild(loves)
		// FAVOURITES
		let favourites=document.createElement("p")
		favourites.className="j m"
		favourites.innerText=`⭐${data?.stats.favorites}`
		stats.appendChild(favourites)
		// CREATION DATE
		let createdate=document.createElement("p")
		createdate.className="j dt"
		createdate.innerText=data?.history.created?`Created ${new Date(data?.history.created).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}`:`Date unknown`
		shared.appendChild(createdate)
		// LINK TO USER
	    let f=document.createElement("a")
        f.href=referenceLink
        f.innerText=data?.title||`Title unavailable`
    	f.className=`j`
		prjct.appendChild(f)
        let g=document.createElement("a")
        g.href=`https://scratch.mit.edu/users/${data?.author.username}`
        g.target = "_blank"
        g.text=data?.author?.username||`author not found`
        g.className=`j k`
        projectauthor.appendChild(g)
        }
	}
	if(!container.innerHTML){
		document.documentElement.style.setProperty('--rows','repeat(1,1fr)');emp=document.createElement("p");emp.style.fontFamily=`"Nunito",sans-serif`;emp.style.fontSize="7vw";emp.style.textAlign="center";emp.style.width="60vw";emp.style.color="white";emp.innerText="No projects found";container.appendChild(emp);
	}else{document.documentElement.style.setProperty('--rows','repeat(2,1fr)')}
	}
	search=document.getElementById("search")
	search.addEventListener('input',(e)=>{
    	query=e.target.value.toLowerCase().trim();
    	update(query)
	});
	(async()=>{await cacheProjects();update("")})();
    </script>
</body>
</html>
