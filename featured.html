<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<link rel='icon' href='i.png'>
    <style>
        .d{
          padding:30px;
          border-radius:20px;
          width:70%;
          background:linear-gradient(50deg, black 0%, gray 100%);
          box-shadow:5px 10px lightgray;
          font-family:"Nunito",system-ui;
          text-align:center;
          font-size:3vw;
          font-weight:700;
        }
        .container{
            background:white;
            box-shadow:4px 4px 4px black;
            border-radius:10px;
            border:4px solid lightgray;
            margin:0 auto;
            justify-content:center;
            display:inline-grid;
            grid-template-rows:repeat(5,min-content);
            grid-template-columns:repeat(5,min-content);
            gap:10px;
        }
        .project{
            background:darkgray;
            width:50px;
            box-shadow:2px 2px 2px gray;
            padding:10px;
            border-radius:10px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Featured Projects</title>
</head>
<body>
    <script src="inject.js"></script>
    <div class="content">
    <br>
    <p style='color:white' class='d'>Scratch Master's Featured Projects</p>
    <div class='container' id="fe">
    </div>
    <script>
        featured=[1180951523,1316859114,1370340557,632326191]
        for(let i in featured){
            let c=document.createElement("img")
            c.className="project"
            c.src=`https://uploads.scratch.mit.edu/projects/thumbnails/${featured[i]}.png`
            let e=document.createElement("a")
            e.href=`https://scratch.mit.edu/projects/${featured[i]}`
            document.getElementById('fe').appendChild(e)
            e.appendChild(c)
	        let f=document.createElement("a")
            f.href=`https://scratch.mit.edu/projects/${featured[i]}`
            f.text=`${featured[i]}`
            document.getElementById('fe').appendChild(f)
            f.appendChild(c)
        }
    </script>
</body>
</html>
