<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<link rel='icon' href='i.png'>
    <style>
        .d{
          padding:30px;
          border-radius:20px;
          width:70%;
          background:linear-gradient(50deg, black 0%, gray 100%);
          box-shadow:5px 10px lightgray;
          font-family:"Nunito",system-ui;
          text-align:center;
          font-size:3vw;
          font-weight:700;
        }
        .container{
            background:black;
            box-shadow:4px 4px 4px rgba(0,0,0,0.4);
            border-radius:10px;
            border:4px solid orange;
            justify-content:center;
	    align-items:center;
            display:inline-grid;
            grid-template-rows:repeat(5,min-content);
            grid-template-columns:repeat(5,min-content);
            gap:20px;
	    padding:50px;
        }
	.project:hover{transform:scale(1.1);border:6px solid white;}
	.j:hover{transform:scale(1.1);color:white;}
        .project{
	    transition:transform 0.4s ease-in, border 0.8s ease-out;
            background:orange;
            width:300px;
            border:4px solid orange;
            border-radius:10px;
        }
	.j{
	    transition:transform 0.4s ease, color 0.4s ease;
	    display:block;
	    text-decoration:none;
	    font-weight:900;
            font-family:'Nunito',sans-serif;
            font-size:50px;
	    color:orange;
	    text-align:center;
	}
	a{text-decoration:none;}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Featured Projects</title>
</head>
<body>
    <script src="inject.js"></script>
    <div class="content">
    <br>
    <p style='color:white' class='d'>Scratch Master's Featured Projects</p>
    <div class='container' id="fe">
    </div>
    <script>
        featured=[1180951523,1316859114,1370340557,632326191,980280062]
        for(let i in featured){
            let c=document.createElement("img")
            c.className="project"
            c.src=`https://uploads.scratch.mit.edu/projects/thumbnails/${featured[i]}.png`
            let e=document.createElement("a")
            e.href=`https://scratch.mit.edu/projects/${featured[i]}`
            document.getElementById('fe').appendChild(e)
            e.appendChild(c)
	    let f=document.createElement("a")
            f.href=`https://scratch.mit.edu/projects/${featured[i]}`
            f.text=`${featured[i]}`
	    f.className=`j`
            document.getElementById('fe').appendChild(f)
            e.appendChild(f)
        }
    </script>
</body>
</html>
