<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<link rel='icon' href='i.png'>
    <style>
        .d{
          padding:30px;
          border-radius:20px;
          width:70%;
          background:linear-gradient(50deg, black 0%, gray 100%);
          box-shadow:5px 10px lightgray;
          font-family:"Nunito",system-ui;
          text-align:center;
          font-size:3vw;
          font-weight:700;
        }
        .container{
            background:black;
            box-shadow:4px 4px 4px rgba(0,0,0,0.4);
            border-radius:10px;
            border:4px solid orange;
            justify-content:center;
	    	align-items:center;
            display:inline-grid;
            grid-template-columns:repeat(4,min-content);
            gap:20px;
	    	padding:50px;
        }
	.project:hover{transform:scale(1.1);border:6px solid white;}
	.j:hover{transform:scale(1.1);color:white;}
        .project{
	    transition:transform 0.4s ease-in, border 0.8s ease-out;
            background:orange;
            width:200px;
            border:4px solid orange;
            border-radius:10px;
        }
	.j{
	    transition:transform 0.4s ease, color 0.4s ease;
	    display:block;
	    text-decoration:none;
	    font-weight:900;
            font-family:'Nunito',sans-serif;
            font-size:20px;
	    color:orange;
	    text-align:center;
	}
    .k{
	    transition:transform 0.4s ease, color 0.4s ease;
	    display:block;
	    text-decoration:none;
	    font-weight:900;
            font-family:'Nunito',sans-serif;
            font-size:20px;
	    color:rgb(75, 62, 39);
	    text-align:center;
	}
	a{text-decoration:none;}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Featured Projects</title>
</head>
<body>
    <div class="content">
        <script src="inject.js"></script>
    <br>
    <p style='color:white' class='d'>Scratch Master's Featured Projects</p>
    <div class='container' id="fe">
    </div>
    <script>
    (async () => {
        let featured=[1180951523,1316859114,1370340557,632326191];
        let rep;let json;let temp;
        let referenceLink;
        let data;
        let getData = (async function(id){
            rep = await fetch(`https://api.scratch.mit.edu/projects/${id}/`)
                if(rep.ok){
                    return await rep.json()
                }
            });
        for(let i of featured){
            referenceLink = `https://scratch.mit.edu/projects/${i}`
            let c=document.createElement("img")
            c.className="project"
            c.src=`https://uploads.scratch.mit.edu/projects/thumbnails/${i}.png`
            let e=document.createElement("a")
            e.href=referenceLink
            document.getElementById('fe').appendChild(e)
            e.appendChild(c)
        data = await getData(i)
	    let f=document.createElement("a")
            f.href=referenceLink
            temp = `${i}`
            if(rep.ok)temp = `${data.title}`
            f.text=temp
	    f.className=`j`
            document.getElementById('fe').appendChild(f)
            e.appendChild(f)
        let g = document.createElement("a")
            g.href = `https://scratch.mit.edu/users/${data.author.username}`
            g.target = "_blank"
            temp = 'by nobody'
            if(rep.ok)temp = `${data.author.username}`
            g.text = temp
            g.className = `j k`
            e.appendChild(g)
        }
    })()
    </script>
</body>
</html>
