<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<link rel='icon' href='i.png'>
    <style>
        .d{
          padding:30px;
          border-radius:20px;
          width:70%;
          background:linear-gradient(50deg, black 0%, gray 100%);
          box-shadow:5px 10px lightgray;
          font-family:"Nunito",system-ui;
          text-align:center;
          font-size:3vw;
          font-weight:700;
        }
        .container{
            background:black;
            box-shadow:4px 4px 4px rgba(0,0,0,0.4);
            border-radius:10px;
            border:4px solid white;
            justify-content:center;
	    	align-items:center;
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:10px;
	    	padding:10px;
        }
		.card{
			border-radius:10px;
            border:4px solid orange;
			background:linear-gradient(50deg,orange 85%,white 90%,orange 95%);
            justify-content:center;
	    	align-items:center;
			display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:15px;
	    	padding:10px;
        }
	.j:hover{color:white;}
    .project{
        background:rgba(0,0,0,0.5);
        width:390px;
        border:4px solid white;
		align-items:center;
		justify-content:center;
		border-radius:10px;
		gap:15px;
		display:flex;
		flex-direction:column;
    }
	.stats{
        background:rgba(0,0,0,0.5);
        width:fit-content;
        border:4px solid white;
		border-radius:10px;
		display:flex;
		gap:10px;
		flex-direction:row;
    }
	.j{
	    transition:color 0.4s ease;
	    display:block;
	    text-decoration:none;
	    font-weight:900;
        font-family:'Nunito',sans-serif;
        font-size:20px;
	    color:orange;
	    text-align:center;
		margin:0;
	}
	.m{width:130px;font-size:20px;}
	.dt{width:390px;font-size:20px;}
	a{text-decoration:none;}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Featured Projects</title>
</head>
<body>
    <div class="content">
        <script src="inject.js"></script>
    <br>
    <p style='color:white' class='d'>Scratch Master's Featured Projects</p>
    <div class='container' id="fe">
    </div>
    <script>
    (async () => {
        let featured=[1380826278,980280062,1180951523,1316859114];
        let rep;let json;let temp;
		let container=document.getElementById('fe')
        let referenceLink;
        let data;
        let getData = (async function(id){
            rep = await fetch(`https://proxy.corsfix.com/?https://api.scratch.mit.edu/projects/${id}/`)
                if(rep.ok){
                    return await rep.json()
                }
            });
        for(let i of featured){
			// PROJECT CARD
			let card=document.createElement("div")
			card.className="card"
			container.appendChild(card)
			// PROJECT IMAGE
			let link=document.createElement("a")
			referenceLink=`https://scratch.mit.edu/projects/${i}`
			link.href=referenceLink
			link.target = "_blank"
			card.appendChild(link)
			link.style.width="390px"
            let c=document.createElement("img")
            c.className="project"
			c.style.width="390px"
            c.src=`https://uploads.scratch.mit.edu/projects/thumbnails/${i}.png`
			link.appendChild(c)
			// INFO
			let info=document.createElement("div")
			info.className="project"
			card.appendChild(info)
			// STATS
			let stats=document.createElement("div")
			stats.className="project stats"
			card.appendChild(stats)
			// SHARED
			let shared=document.createElement("div")
			shared.className="project stats"
			card.appendChild(shared)
        data = await getData(i)
		// AUTHOR PROFILE PICTURE
		let linkuser=document.createElement("a")
		linkuser.style.color=`rgb(160,130,60)`
		linkuser.href=`https://scratch.mit.edu/users/${data?.author?.username||"placeholder"}`
		linkuser.target = "_blank"
		info.appendChild(linkuser)
	    let l=document.createElement("img")
		let image=data?.author?.profile?.images?.["90x90"]
	    if(image){l.src=image;l.width=200}
		l.style.borderRadius="20px"
	    linkuser.appendChild(l)
		// VIEWS
		let views=document.createElement("p")
		views.className="j m"
		views.innerText=`👁️${data.stats.views}`
		stats.appendChild(views)
		// LOVES
		let loves=document.createElement("p")
		loves.className="j m"
		loves.innerText=`❤️${data.stats.loves}`
		stats.appendChild(loves)
		// FAVOURITES
		let favourites=document.createElement("p")
		favourites.className="j m"
		favourites.innerText=`⭐${data.stats.favorites}`
		stats.appendChild(favourites)
		// CREATION DATE
		let createdate=document.createElement("p")
		createdate.className="j dt"
		createdate.innerText=data.history.created?`Created ${String(new Date(data.history.created).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}))}`:`Date unknown`
		shared.appendChild(createdate)
		// LINK TO USER
	    let f=document.createElement("a")
            f.href=referenceLink
            f.innerText=rep.ok?data.title:`no title`
	    	f.className=`j`
            info.appendChild(f)
            let g=document.createElement("a")
			g.style.color="white"
            g.href=`https://scratch.mit.edu/users/${data.author.username}`
            g.target = "_blank"
            g.text=rep.ok?data.author.username:`author not found`
            g.className=`j k`
            info.appendChild(g)
        }
    })()
    </script>
</body>
</html>
