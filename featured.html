<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<link rel='icon' href='i.png'>
    <style>
        .d{
          padding:30px;
          border-radius:20px;
          width:70%;
          background:linear-gradient(50deg, black 0%, gray 100%);
          box-shadow:5px 10px lightgray;
          font-family:"Nunito",system-ui;
          text-align:center;
          font-size:3vw;
          font-weight:700;
        }
        .container{
            width:90%;
            border-radius:10px;
            border:4px solid lightgray;
            margin:0 auto;
            justify-content:left;
            display:grid;
            grid-template-columns:repeat(4, 1fr);
            grid-template-rows:repeat(5, 1fr);
            padding:10%;
            gap: 4px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Featured Projects</title>
</head>
<body>
    <script src="inject.js"></script>
    <div class="content">
    <br>
    <p style='color:white' class='d'>Scratch Master's Featured Projects</p>
    <div class='container' id="fe">
    </div>
    <script>
        featured=[1180951523,1316859114,1370340557,632326191,1000,1000000]
        for(let i in featured){
            let e=document.createElement("a")
            document.getElementById('fe').appendChild(e)
            e.href=`https://scratch.mit.edu/projects/${featured[i]}`
            let c=document.createElement("img")
            e.appendChild(c)
            c.src=`https://uploads.scratch.mit.edu/projects/thumbnails/${featured[i]}.png`
            c.style.width = '20vw'
        }
    </script>
</body>
</html>
