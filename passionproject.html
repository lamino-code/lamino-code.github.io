<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="another.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match the Number!</title>
    <style>
        body{
            background-color:antiquewhite;
        }
        .g:hover{
            transform:scale(1.2)
        }
        .g{
            transition:transform 0.3s ease-in-out;
            font-family:'Poppins';
            position:relative;
            top:10vh;
            width:200px;
            height:150px;
            font-size:30px;
            margin:20px;
            border-radius:20px;
            background:linear-gradient(dodgerblue 30%, cyan 60%);
        }
        .i{
            color:white;
            text-shadow:3px 3px 3px black;
            transition:transform 0.3s ease-in-out;
            font-family:'Poppins';
            position:relative;
            top:10vh;
            width:200px;
            height:100px;
            font-size:30px;
            margin:20px;
            border-radius:20px;
            background:linear-gradient(rgb(53,123,61) 40%, rgb(116,157,104) 60%);
        }
        .difficulty{
            display:flex;
            justify-content:center;
            width:99vw;
        }
        .game2{
            display:grid;
            justify-content:center;
            grid-template-columns: auto auto auto auto auto auto;
            grid-template-rows: auto auto;
        }
        .a{
            text-align:center;
            font-size:70px;
            font-family:'Poppins';
            margin:0px;
        }
    </style>
</head>
<body>
    <script src="inject.js"></script>
    <script>
        s=0
        difficulty = 0
        amounts=[[1,2,3,4,5],[1,3,9,27,80],[1,5,20,100,500]]
        dif=a=>{times = -1;let b=document.getElementById('dif');b.innerHTML=['Easy','Medium','Hard'][a];difficulty=a;change();setGoal();let gc = document.getElementById("score");s=0;gc.innerText="Score: 0";}
        change=()=>{for(let i=0;i<5;i++){document.getElementById("b"+i).innerText="Add "+amounts[difficulty][i]}}
        undoLast=()=>{let g = document.getElementById("amount");g.textContent=parseInt(g.innerText)-lastMove;lastMove=-lastMove;if(parseInt(g.innerText)<0){g.innerText=0}}
        add=b=>{let g = document.getElementById("amount");g.textContent=parseInt(g.innerText)+amounts[difficulty][b];lastMove=amounts[difficulty][b]}
        message = ""
        setGoal=()=>{
            timer = Date.now()+(18000/(difficulty+1))
            let ga = document.getElementById("amount")
            let gb = document.getElementById("goal")
            if(times>0){
                if(Number(ga.textContent)==goal){
                    message = "Great job! "
                    s++
                    let gc = document.getElementById("score");gc.innerText="Score: " + s
                }else{
                message = "Try again. "
                }
            }
            ga.textContent=0
            goal = Math.floor(Math.random()*4*amounts[difficulty][4])
            gb.textContent=message + "Your goal is "+goal+"."
            times++
        }
        timer = 0
        times = -1
        game=()=>{change();dif(0);setGoal();interval=setInterval(setGoal,18000/(difficulty+1));}
        window.onload = game;
        setInterval(function(){let g = document.getElementById("timer");g.innerText=(timer-Date.now())/1000;if(timer-Date.now()<0){setGoal();}},50)
    </script>
    <div class="content">
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <img src="icon.png" style="width:20%;position:absolute;left:80%;">
    <p class="a">Match the number!</p>
    <p id="dif" class="a" style="font-size:50px;">Easy</p>
    <p id="score" class="a" style="font-size:60px;">Score: 0</p>
    <p id="timer" class="a" style="font-size:40px;">timer</p>
    <p id="goal" class="a" style="font-size:60px;">Your goal is 0.</p>
    <p id="amount" class="a">0</p>
    <div class="game2" style="margin:-40px;">
        <button class="i" id="b0" onclick="add(0)">Add 1</button>
        <button class="i" id="b1" onclick="add(1)">Add 2</button>
        <button class="i" id="b2" onclick="add(2)">Add 3</button>
        <button class="i" id="b3" onclick="add(3)">Add 4</button>
        <button class="i" id="b4" onclick="add(4)">Add 5</button>
        <button class="i" onclick="undoLast()">Undo</button>
    </div>
    <br>
    <div class="difficulty">
        <button class="g" onclick="dif(0)">Easy</button>
        <button class="g" onclick="dif(1)">Medium</button>
        <button class="g" onclick="dif(2)">Hard</button>
    </div>
    </div>
</body>
</html>
